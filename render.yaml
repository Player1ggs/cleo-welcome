services:
  - type: web
    name: discord-welcome-bot
    runtime: docker
    plan: free
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: WELCOME_CHANNEL_ID
        sync: false
      - key: GOODBYE_CHANNEL_ID
        sync: false
      - key: AUTO_ROLE_ID
        sync: false
      - key: SEND_DM_WELCOME
        value: true
      - key: PORT
        value: 3000